name: release

# Push a tag like v0.1.0 to publish a GitHub Release with binaries.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags for the version string
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: quality gates
        run: make check
      - name: build binaries
        run: make release
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
