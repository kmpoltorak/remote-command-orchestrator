# Test environment. Same jobs as prod, different hosts and values.
# Credentials are references only: secrets come from env variables or key files.
credentials:
  deploy-key:
    type: private_key
    username: deploy
    key_file: ~/.ssh/deploy_test_ed25519
    # no sudo_password_env: test hosts use NOPASSWD sudo

defaults:
  credential: deploy-key
  variables:
    ntp_server: ntp.test.example.com
    db_user: app_test

groups:
  web:
    hosts:
      - name: test-web-01
        address: 192.0.2.30
  db:
    hosts:
      - name: test-db-01
        address: 198.51.100.30
