# OpenWrt / Teltonika RutOS routers. Use it on its own or next to hosts.yaml:
#   rco run -i examples/inventories/prod/routers.yaml -j examples/jobs/openwrt-sim-switch
credentials:
  router-key:
    type: private_key
    username: root                   # OpenWrt has no sudo; log in as root
    key_file: ~/.ssh/routers_ed25519

defaults:
  credential: router-key

groups:
  routers:
    defaults:
      tags: [lte]
    hosts:
      - name: rut-001
        address: 10.64.0.11
      - name: rut-002
        address: 10.64.0.12
