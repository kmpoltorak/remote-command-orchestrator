# Hosts reachable only through a jump host. Tunnelling is native Go
# (x/crypto/ssh direct-tcpip); no ssh binary is executed.
credentials:
  bastion-key:
    type: private_key
    username: jump
    key_file: ~/.ssh/bastion_ed25519
  internal-key:
    type: private_key
    username: deploy
    key_file: ~/.ssh/internal_ed25519

bastions:
  corp-bastion:
    address: bastion.example.com
    credential: bastion-key

defaults:
  credential: internal-key
  bastion: corp-bastion

hosts:
  - name: internal-app-01
    address: 10.50.2.10
  - name: internal-app-02
    address: 10.50.2.11
    tags: [canary]
