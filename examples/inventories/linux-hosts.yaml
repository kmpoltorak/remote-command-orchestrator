# Credentials are references: secrets come from environment variables or key files.
credentials:
  deploy-key:
    type: private_key
    username: deploy
    key_file: ~/.ssh/deploy_ed25519
    sudo_password_env: DEPLOY_SUDO_PASSWORD   # omit for NOPASSWD sudo
  deploy-key-encrypted:
    type: private_key
    username: deploy
    key_file: ~/.ssh/deploy_rsa
    passphrase_env: DEPLOY_KEY_PASSPHRASE
  legacy-password:
    type: password
    username: admin
    password_env: LEGACY_PASSWORD            # also used for sudo by default

defaults:
  port: 22
  credential: deploy-key

groups:
  web:
    defaults:
      tags: [production]
      variables:
        ntp_server: ntp1.example.com
    hosts:
      - name: web-01
        address: 10.20.1.10
      - name: web-02
        address: 10.20.1.11

  batch:
    defaults:
      credential: deploy-key-encrypted
      tags: [staging]
    hosts:
      - name: batch-01
        address: 10.20.2.10
        port: 2222
        variables:
          ntp_server: ntp2.example.com

  legacy:
    defaults:
      credential: legacy-password
    hosts:
      - name: old-app-01
        address: 10.20.9.5
