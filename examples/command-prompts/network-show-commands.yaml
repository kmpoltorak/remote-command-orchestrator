name: network-show-commands
description: Read-only inventory commands for Cisco IOS style devices
version: "1.0"

session:
  mode: interactive
  profile: cisco_ios

defaults:
  command_timeout: 30s
  expect_timeout: 10s

steps:
  - name: disable-paging
    command: terminal length 0
    expect:
      regex: '#\s*$'

  - name: show-version
    command: show version
    expect:
      regex: '#\s*$'
      not_contains: "Invalid input"

  - name: show-interfaces
    command: show ip interface brief
    expect:
      regex: '#\s*$'
      not_contains:
        - "Invalid input"
        - "Incomplete command"

  - name: show-inventory
    command: show inventory
    continue_on_error: true
    expect:
      regex: '#\s*$'
