name: network-config-with-validation
description: >
  Change an interface description with prechecks, postchecks and an explicit
  rollback that restores the previous description.
version: "2.1"

metadata:
  owner: network-automation
  change_type: standard

session:
  mode: interactive
  profile: cisco_ios

defaults:
  command_timeout: 15s
  expect_timeout: 8s

retry:
  host_attempts: 2          # re-run whole workflow only if nothing was sent yet
  delay: 5s
  retry_on: [CONNECTION_TIMEOUT, SESSION_FAILED]

variables:
  interface:
    required: true
  description:
    required: true
  previous_description:
    required: true
    description: Description to restore on rollback
  enable_password:
    required: false
    sensitive: true
    description: Supplied with --var-env enable_password=ENABLE_PASSWORD

prechecks:
  - name: verify-platform
    command: show version
    expect:
      contains: "Cisco"
      regex: '#\s*$'

  - name: verify-interface-exists
    command: "show interface {{ .interface }} description"
    expect:
      regex: '#\s*$'
      not_contains: "Invalid input"

steps:
  - name: enable
    when:
      variable: enable_password
      exists: true
    command: enable
    expect:
      regex: 'Password:\s*$'

  - name: enable-password
    when:
      variable: enable_password
      exists: true
    command: "{{ .enable_password }}"
    sensitive: true
    expect:
      regex: '#\s*$'

  - name: enter-configuration-mode
    command: configure terminal
    expect:
      regex: '\(config\)#\s*$'

  - name: select-interface
    command: "interface {{ .interface }}"
    expect:
      regex: '\(config-if\)#\s*$'

  - name: configure-description
    command: "description {{ .description }}"
    delay_after: 500ms
    expect:
      regex: '\(config-if\)#\s*$'
      not_contains: ["Invalid input", "Error"]

  - name: end-configuration
    command: end
    expect:
      regex: '[^)]#\s*$'

postchecks:
  - name: verify-description
    command: "show interface {{ .interface }} description"
    expect:
      contains: "{{ .description }}"
      regex: '#\s*$'

  - name: save-configuration
    command: write memory
    retries: 2
    retry_delay: 2s
    expect:
      contains: "OK"

rollback:
  on_failure: true
  steps:
    - name: rollback-configure
      command: configure terminal
      expect:
        regex: '\(config\)#\s*$'
    - name: rollback-select-interface
      command: "interface {{ .interface }}"
      expect:
        regex: '\(config-if\)#\s*$'
    - name: restore-description
      command: "description {{ .previous_description }}"
      expect:
        regex: '\(config-if\)#\s*$'
    - name: rollback-end
      command: end
      expect:
        regex: '#\s*$'
