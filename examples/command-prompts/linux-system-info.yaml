name: linux-system-info
description: Collect basic system information from Linux hosts
version: "1.0"

# exit_code expectations imply exec mode: every step runs in its own SSH
# channel on one shared SSH connection.
session:
  mode: exec

defaults:
  command_timeout: 15s

steps:
  - name: hostname
    command: hostname
    expect:
      exit_code: 0

  - name: kernel
    command: uname -a
    expect:
      exit_code: 0

  - name: filesystem
    command: df -h
    expect:
      exit_code: 0

  - name: uptime
    command: uptime
    continue_on_error: true
    expect:
      exit_code: 0
