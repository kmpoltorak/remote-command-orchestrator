version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G204 # tests start /bin/sh inside the in-process SSH test server
        - G304 # reading user-supplied job/inventory/key files is the purpose of the tool
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, revive]
      - path: internal/sshtest/ # test-only SSH server that runs local commands
        linters: [gosec]
formatters:
  enable: [gofmt]
